<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Belt/Judo symbol -->
  <text x="256" y="320" font-size="240" text-anchor="middle" fill="white" opacity="0.95">🥋</text>
  <!-- Bottom bar -->
  <rect x="80" y="390" width="352" height="14" rx="7" fill="url(#accent)" opacity="0.7"/>
  <!-- Small text -->
  <text x="256" y="460" font-size="42" text-anchor="middle" fill="white" opacity="0.85" font-family="Arial, sans-serif" font-weight="bold">JudoManager</text>
</svg>
