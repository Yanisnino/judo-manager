name: 🥋 Build & Release JudoManager Pro

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      # ─── 1. Checkout ───────────────────────────────────────────────────
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ─── 2. Node.js ────────────────────────────────────────────────────
      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ─── 3. Install ALL deps (includes electron + electron-builder) ────
      - name: 🗑️ Remove old package-lock (avoid version conflicts)
        run: Remove-Item package-lock.json -ErrorAction SilentlyContinue

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      # ─── 4. Build Next.js in standalone mode ──────────────────────────
      - name: 🔨 Build Next.js (standalone)
        run: npm run build
        env:
          NODE_ENV: production

      # ─── 5. Prepare electron bundle ────────────────────────────────────
      - name: 📂 Prepare standalone bundle
        run: node build-scripts/prepare-standalone.js

      # ─── 6. Create fallback icon if missing ────────────────────────────
      - name: 🎨 Create app icon (fallback)
        shell: pwsh
        run: |
          if (-Not (Test-Path "electron/icon.ico")) {
            Write-Host "⚠ icon.ico not found - creating placeholder..."
            # Download a generic icon as placeholder
            Invoke-WebRequest -Uri "https://github.com/electron/electron/raw/main/shell/browser/resources/win/electron.ico" -OutFile "electron/icon.ico" -UseBasicParsing
            Write-Host "✅ Placeholder icon created."
          } else {
            Write-Host "✅ icon.ico already exists."
          }

      # ─── 7. Build .exe installer ───────────────────────────────────────
      - name: 🏗️ Build Windows installer (.exe)
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ─── 8. Find the generated .exe ────────────────────────────────────
      - name: 🔍 List dist-exe contents
        shell: pwsh
        run: |
          Write-Host "=== dist-exe contents ==="
          Get-ChildItem -Path dist-exe -Recurse | Select-Object FullName, Length

      # ─── 9. Upload as GitHub Actions artifact (always) ────────────────
      - name: 📤 Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: JudoManager-Pro-Setup-${{ github.ref_name || inputs.version }}
          path: dist-exe/*.exe
          retention-days: 30
          if-no-files-found: error

      # ─── 10. Create GitHub Release (only on tag push) ─────────────────
      - name: 🚀 Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-exe/*.exe
          name: "🥋 JudoManager Pro ${{ github.ref_name }}"
          draft: false
          prerelease: false
          body: |
            ## 🥋 JudoManager Pro ${{ github.ref_name }}
            ### نظام إدارة أندية الجودو - الإصدار العام المباشر

            ---

            ### ⬇️ تحميل البرنامج

            انقر على ملف **`JudoManager-Pro-Setup.exe`** أدناه لتحميل البرنامج مباشرة.

            ---

            ### 📋 خطوات التثبيت:
            1. ⬇️ حمّل ملف `JudoManager-Pro-Setup.exe`
            2. 🖱️ شغّل الملف بالنقر عليه مرتين
            3. ✅ اتبع خطوات التثبيت (بعض الأجهزة قد تطلب صلاحيات مسؤول)
            4. 🖥️ افتح البرنامج من اختصار سطح المكتب
            5. 🔑 أدخل مفتاح الترخيص للبدء

            ---

            ### 💻 متطلبات النظام:
            | المتطلب | التفاصيل |
            |---------|----------|
            | نظام التشغيل | Windows 10 / 11 (64-bit) |
            | الذاكرة العشوائية | 4 GB RAM على الأقل |
            | المساحة الحرة | 500 MB على الأقل |

            ---

            ### 📞 الدعم الفني:
            للمساعدة تواصل على: **0553823611**
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
